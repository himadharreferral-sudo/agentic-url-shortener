<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1400" viewBox="0 0 1440 1400" role="img" aria-labelledby="title description">
  <title id="title">URL Shortener  &amp; SRE Observability Flow</title>
  <desc id="description">URL shortener flow showing request hardening, URL validation, Base62 mapping, cache-first redirects, privacy-aware analytics, and a one-hour SRE dashboard window.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#526581"/>
    </marker>
    <style>
      .bg { fill: #f5f7fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #14213d; }
      .subtitle { font: 15px Arial, sans-serif; fill: #526581; }
      .section { font: 700 19px Arial, sans-serif; fill: #17324d; }
      .node { fill: #fff; stroke: #8aa0b8; stroke-width: 2; rx: 12; }
      .api { fill: #e8f1ff; stroke: #3973b9; }
      .storage { fill: #e9f7ef; stroke: #39805a; }
      .cache { fill: #fff3d9; stroke: #b77c15; }
      .decision { fill: #fff; stroke: #8a6bb5; stroke-width: 2; }
      .nodeTitle { font: 700 15px Arial, sans-serif; fill: #172b4d; text-anchor: middle; }
      .nodeText { font: 13px Arial, sans-serif; fill: #35465e; text-anchor: middle; }
      .line { fill: none; stroke: #526581; stroke-width: 2.2; marker-end: url(#arrow); }
      .telemetry { fill: none; stroke: #7a61a8; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .label { font: 12px Arial, sans-serif; fill: #526581; }
      .note { fill: #eef2f8; stroke: #c5cfdd; stroke-width: 1.5; rx: 10; }
      .noteText { font: 13px Arial, sans-serif; fill: #35465e; }
      .lane { fill: #fff; stroke: #d7dfeb; stroke-width: 1.5; rx: 16; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1120"/>
  <text class="title" x="48" y="52">URL Shortener  &amp; SRE Observability Flow</text>
  <text class="subtitle" x="48" y="80">Current prototype: bounded HTTP inputs, URL guardrails, SQLite, local LRU cache, and one-hour in-process SLI metrics</text>

  <rect class="lane" x="35" y="110" width="1370" height="380"/>
  <text class="section" x="60" y="145">A. Create a short link · validate before storing</text>

  <rect class="node" x="70" y="205" width="170" height="78"/>
  <text class="nodeTitle" x="155" y="234">Client</text>
  <text class="nodeText" x="155" y="258">POST long URL</text>

  <rect class="node api" x="315" y="190" width="210" height="108"/>
  <text class="nodeTitle" x="420" y="220">HTTP API</text>
  <text class="nodeText" x="420" y="244">/api/v1/links</text>
  <text class="nodeText" x="420" y="266">JSON body capped at 16 KiB</text>

  <rect class="node api" x="600" y="190" width="210" height="108"/>
  <text class="nodeTitle" x="705" y="220">Guardrails</text>
  <text class="nodeText" x="705" y="244">rate-limit by peer IP</text>
  <text class="nodeText" x="705" y="266">validate types, URL + code</text>
  <text class="nodeText" x="705" y="285">reject local/private IP targets</text>

  <polygon class="decision" points="920,190 1005,244 920,298 835,244"/>
  <text class="nodeTitle" x="920" y="240">Custom code?</text>
  <text class="nodeText" x="920" y="260">provided by client</text>

  <rect class="node api" x="1080" y="160" width="250" height="88"/>
  <text class="nodeTitle" x="1205" y="190">Generate code</text>
  <text class="nodeText" x="1205" y="214">allocate numeric ID → Base62</text>

  <rect class="node api" x="1080" y="285" width="250" height="78"/>
  <text class="nodeTitle" x="1205" y="314">Use validated alias</text>
  <text class="nodeText" x="1205" y="338">unique custom code</text>

  <rect class="node storage" x="770" y="370" width="280" height="82"/>
  <text class="nodeTitle" x="910" y="399">SQLite mapping</text>
  <text class="nodeText" x="910" y="423">code → URL, ID, TTL, metadata</text>

  <rect class="node cache" x="1110" y="385" width="220" height="70"/>
  <text class="nodeTitle" x="1220" y="413">Warm local cache</text>
  <text class="nodeText" x="1220" y="437">LRU stores created link</text>

  <path class="line" d="M240 244 H315"/>
  <path class="line" d="M525 244 H600"/>
  <path class="line" d="M810 244 H835"/>
  <path class="line" d="M1005 228 H1080"/>
  <text class="label" x="1032" y="218">No</text>
  <path class="line" d="M920 298 V324 H1080"/>
  <text class="label" x="932" y="319">Yes</text>
  <path class="line" d="M1205 248 V370 H1050"/>
  <path class="line" d="M1205 363 V370"/>
  <path class="line" d="M1050 411 H1110"/>
  <path class="line" d="M1220 385 V360 H1350 V244 H1330"/>
  <text class="label" x="1260" y="378">201 + short URL</text>

  <rect class="note" x="70" y="385" width="580" height="68"/>
  <text class="noteText" x="90" y="412">Reject malformed/ambiguous framing, embedded URL credentials, and oversized bodies.</text>
  <text class="noteText" x="90" y="436">10-second socket timeout · 400 invalid · 413 too large · 429 rate limited</text>

  <rect class="lane" x="35" y="520" width="1370" height="440"/>
  <text class="section" x="60" y="555">B. Resolve a short link · cache first, then validate lifetime</text>

  <rect class="node" x="70" y="650" width="170" height="78"/>
  <text class="nodeTitle" x="155" y="679">Visitor</text>
  <text class="nodeText" x="155" y="703">GET /{code}</text>

  <rect class="node api" x="315" y="635" width="210" height="108"/>
  <text class="nodeTitle" x="420" y="665">HTTP API</text>
  <text class="nodeText" x="420" y="689">extract short code</text>
  <text class="nodeText" x="420" y="711">bound user-agent/referrer</text>

  <rect class="node cache" x="600" y="635" width="205" height="108"/>
  <text class="nodeTitle" x="702" y="665">LRU cache lookup</text>
  <text class="nodeText" x="702" y="689">in-process cache</text>
  <text class="nodeText" x="702" y="711">cache-first read</text>

  <polygon class="decision" points="920,635 1005,689 920,743 835,689"/>
  <text class="nodeTitle" x="920" y="685">Cache hit?</text>
  <text class="nodeText" x="920" y="705">code found</text>

  <rect class="node storage" x="1080" y="595" width="250" height="85"/>
  <text class="nodeTitle" x="1205" y="624">SQLite lookup</text>
  <text class="nodeText" x="1205" y="648">load mapping on cache miss</text>

  <rect class="node cache" x="1080" y="705" width="250" height="76"/>
  <text class="nodeTitle" x="1205" y="734">Populate cache</text>
  <text class="nodeText" x="1205" y="758">cache DB result for next click</text>

  <polygon class="decision" points="920,785 1005,839 920,893 835,839"/>
  <text class="nodeTitle" x="920" y="835">Active + TTL</text>
  <text class="nodeText" x="920" y="855">not expired?</text>

  <rect class="node api" x="600" y="800" width="205" height="78"/>
  <text class="nodeTitle" x="702" y="829">Prepare redirect</text>
  <text class="nodeText" x="702" y="853">301 or 302 response</text>

  <rect class="node storage" x="315" y="800" width="210" height="78"/>
  <text class="nodeTitle" x="420" y="829">Click analytics</text>
  <text class="nodeText" x="420" y="853">best-effort click event write</text>
  <text class="nodeText" x="420" y="870">public stats hide visitor data</text>

  <rect class="node" x="70" y="800" width="170" height="78"/>
  <text class="nodeTitle" x="155" y="829">Visitor browser</text>
  <text class="nodeText" x="155" y="853">loads destination</text>

  <rect class="node" x="1080" y="830" width="250" height="70"/>
  <text class="nodeTitle" x="1205" y="858">Not found / expired</text>
  <text class="nodeText" x="1205" y="882">404 / 410 response</text>

  <path class="line" d="M240 689 H315"/>
  <path class="line" d="M525 689 H600"/>
  <path class="line" d="M805 689 H835"/>
  <path class="line" d="M1005 674 H1080"/>
  <text class="label" x="1030" y="663">No</text>
  <path class="line" d="M1205 680 V705"/>
  <path class="line" d="M1080 743 H1025 V839 H1005"/>
  <path class="line" d="M920 743 V785"/>
  <text class="label" x="932" y="770">Yes</text>
  <path class="line" d="M835 839 H805"/>
  <text class="label" x="813" y="827">Yes</text>
  <path class="line" d="M600 839 H525"/>
  <path class="line" d="M315 839 H240"/>
  <path class="line" d="M1005 839 H1080"/>
  <text class="label" x="1022" y="827">No</text>
  <rect class="lane" x="35" y="990" width="1370" height="300"/>
  <text class="section" x="60" y="1025">C. Observe the four golden signals</text>

  <rect class="node api" x="70" y="1060" width="260" height="112"/>
  <text class="nodeTitle" x="200" y="1088">Every HTTP request</text>
  <text class="nodeText" x="200" y="1112">normalized method + route + status</text>
  <text class="nodeText" x="200" y="1134">perf_counter latency + in-flight</text>
  <text class="nodeText" x="200" y="1155">fixed route labels prevent code cardinality</text>

  <rect class="node storage" x="420" y="1060" width="320" height="112"/>
  <text class="nodeTitle" x="580" y="1088">In-process SLI collector</text>
  <text class="nodeText" x="580" y="1112">rolling 1 h: traffic + 5xx rate</text>
  <text class="nodeText" x="580" y="1134">latency histogram: approximate p50/p95</text>
  <text class="nodeText" x="580" y="1155">thread count + cache occupancy gauges</text>

  <rect class="node cache" x="850" y="1045" width="230" height="88"/>
  <text class="nodeTitle" x="965" y="1075">SRE dashboard</text>
  <text class="nodeText" x="965" y="1098">/dashboard · polls every 5 s</text>
  <text class="nodeText" x="965" y="1118">traffic · errors · latency · saturation</text>

  <rect class="node cache" x="850" y="1150" width="230" height="88"/>
  <text class="nodeTitle" x="965" y="1180">Metrics scrape</text>
  <text class="nodeText" x="965" y="1203">/metrics · Prometheus format</text>
  <text class="nodeText" x="965" y="1223">external collector retains history</text>

  <rect class="node" x="1130" y="1080" width="220" height="108"/>
  <text class="nodeTitle" x="1240" y="1110">Operational probes</text>
  <text class="nodeText" x="1240" y="1134">/health · process liveness</text>
  <text class="nodeText" x="1240" y="1156">/ready · SQLite readiness</text>

  <path class="telemetry" d="M330 1116 H420"/>
  <path class="telemetry" d="M740 1100 H850"/>
  <path class="telemetry" d="M740 1130 H800 V1194 H850"/>
  <path class="telemetry" d="M740 1150 H1120 V1134 H1130"/>

  <rect class="note" x="70" y="1310" width="1260" height="62"/>
  <text class="noteText" x="92" y="1336">Security note: target checks do not resolve DNS; the service redirects and does not fetch destinations, so these checks are not an SSRF boundary.</text>
  <text class="noteText" x="92" y="1358">Saturation is a prototype proxy (in-flight requests, threads, LRU use); no CPU/memory or bounded worker pool. In-memory metrics reset on restart.</text>
</svg>
